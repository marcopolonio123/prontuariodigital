name: Biometric lab (isolated prototype)
on:
  pull_request:
    paths:
      - 'experiments/biometrics/**'
      - '.github/workflows/biometric-lab.yml'
  push:
    branches: [develop]
    paths:
      - 'experiments/biometrics/**'
      - '.github/workflows/biometric-lab.yml'
jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
        working-directory: experiments/biometrics
      - run: python scripts/download_models.py
        working-directory: experiments/biometrics
      - run: mvn -B -q -f fingerprint/pom.xml package -DskipTests
        working-directory: experiments/biometrics
      - run: python -m pytest tests -q --tb=short
        working-directory: experiments/biometrics
      - run: node --check experiments/biometrics/web/lab.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node experiments/biometrics/tests/ui-smoke.mjs
      - run: docker build -t mydoctor-biometric-lab:test experiments/biometrics
