# ============================================================
#  MY DOCTOR — Publicação automática na Hostinger
#  Toda sincronização com o GitHub → build → envio via FTP
#  para a pasta public_html do domínio mydoctor.med.br
#
#  Segredos obrigatórios no GitHub:
#  Settings → Secrets and variables → Actions → New repository secret
#    FTP_HOST      ex.: ftp.mydoctor.med.br  (hPanel → Contas FTP)
#    FTP_USERNAME  usuário da conta FTP
#    FTP_PASSWORD  senha da conta FTP
# ============================================================
name: Deploy → Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site (pasta dist/)
        run: npm run build

      - name: Enviar para a Hostinger (FTP)
        # Nota: se aparecer um aviso amarelo de "Node.js 20 deprecated" para esta
        # ação, é apenas informativo — ela roda normalmente no Node 24.
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.well-known/**
