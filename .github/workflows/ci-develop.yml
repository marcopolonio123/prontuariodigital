name: MyDoctor CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mydoctor
          POSTGRES_PASSWORD: mydoctor
          POSTGRES_DB: mydoctor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mydoctor -d mydoctor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://mydoctor:mydoctor@localhost:5432/mydoctor
      JWT_SECRET: ci-mydoctor-secret-with-more-than-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run prisma:generate
      - run: npx prisma db push --skip-generate
      - run: npm run build
      - name: API smoke test
        shell: bash
        run: |
          node dist/index.js > /tmp/mydoctor-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true; cat /tmp/mydoctor-api.log' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"apiV1":true' /tmp/health.json
